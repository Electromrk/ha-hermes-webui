# enable_terminal: false. Refused here, because the webui's terminal has no off switch of its own.
# Case-insensitive on purpose: the webui casefolds /api/ paths before routing.
# JSON, because the webui shows the body in its error toast.
location ~* "^/api/terminal(/|;|$)" {
    default_type application/json;
    return 404 '{"error":"The terminal is turned off. Turn on enable_terminal in the app configuration."}';
}
location ~* "^/terminal(/|;|$)" {
    default_type application/json;
    return 404 '{"error":"The terminal is turned off. Turn on enable_terminal in the app configuration."}';
}
