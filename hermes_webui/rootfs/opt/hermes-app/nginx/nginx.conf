# Runs in the foreground under s6. The two includes from /run/hermes-app are rendered by hermes-init
# from the app options.
worker_processes 1;
pid /run/nginx.pid;
# Not the runtime user, so a worker can't read the webui's environment through /proc.
user www-data www-data;
include /run/hermes-app/nginx-log.conf;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    default_type application/octet-stream;

    # Rewrite only frame-ancestors; the rest of each policy stays as the webui wrote it.
    map $upstream_http_content_security_policy $csp_enforced {
        "~^(?<csp1a>.*)frame-ancestors 'none'(?<csp1b>.*)$" "${csp1a}frame-ancestors 'self'${csp1b}";
        default $upstream_http_content_security_policy;
    }
    map $upstream_http_content_security_policy_report_only $csp_report_only {
        "~^(?<csp2a>.*)frame-ancestors 'none'(?<csp2b>.*)$" "${csp2a}frame-ancestors 'self'${csp2b}";
        default $upstream_http_content_security_policy_report_only;
    }

    upstream webui {
        server 127.0.0.1:8787;
    }

    server {
        listen 8099 default_server;

        # 20 MB is the webui's upload cap (HERMES_WEBUI_MAX_UPLOAD_MB); the rest is multipart overhead.
        client_max_body_size 25m;
        # Keep request buffering on. With ingress_stream the Supervisor sends POST bodies chunked,
        # and the webui only reads Content-Length; nginx de-chunks them by buffering.
        proxy_request_buffering on;
        # Off for SSE: the chat and the terminal stream through here.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # $http_host keeps the port: the webui's CSRF check compares it with Origin.
        # The Supervisor's X-Remote-User-* headers pass through as they are, and it strips client copies.
        proxy_set_header Host $http_host;
        # One request per connection, on purpose, and no upstream keepalive. The webui doesn't read every
        # body (OPTIONS, for one), so on a reused connection a body is parsed as the next request. That
        # request would pass every block below and bring its own X-Remote-User-Id.
        proxy_set_header Connection close;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;
        add_header Content-Security-Policy $csp_enforced always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;

        # Stays below the Supervisor's 10 s watchdog timeout, so a hung webui gives an error, not a hang.
        location = /health {
            allow 172.30.32.2;
            allow 127.0.0.1;
            deny all;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_pass http://webui/health;
        }

        # Only the Supervisor's Ingress may connect. A "return" below runs before these two lines, so
        # other addresses get the same fixed answer on those paths. Nothing reaches the webui either way.
        allow 172.30.32.2;
        deny all;

        # Updates arrive as app versions only, and s6 owns the restart and the processes.
        # Case-insensitive on purpose: the webui casefolds /api/ paths before routing.
        # ";" on purpose: its URL parser drops ";params" from the last segment, so those would still route.
        location ~* "^/api/updates/(apply|force|clear_lock)(/|;|$)" {
            default_type application/json;
            return 403 '{"error":"Updates are delivered as new app versions in Home Assistant."}';
        }
        location ~* "^/api/extensions/(install|uninstall|registry)(/|;|$)" {
            default_type application/json;
            return 403 '{"error":"Extensions are not available in this app."}';
        }
        location ~* "^/api/health/restart(/|;|$)" {
            default_type application/json;
            return 403 '{"error":"Restart the app in Home Assistant."}';
        }
        # It ends running chats, and s6 brings the webui straight back anyway.
        location ~* "^/api/shutdown(/|;|$)" {
            default_type application/json;
            return 403 '{"error":"Stop or restart the app in Home Assistant."}';
        }
        location ~* "^/api/gateway/(start|stop|restart)(/|;|$)" {
            default_type application/json;
            return 403 '{"error":"This app runs without the Hermes gateway."}';
        }

        include /run/hermes-app/nginx-terminal.conf;

        location / {
            proxy_pass http://webui;
        }
    }
}
