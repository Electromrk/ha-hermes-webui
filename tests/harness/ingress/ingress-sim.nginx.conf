# Ingress simulator: plays Core plus the Supervisor's Ingress proxy at 172.30.32.2.
# Three listeners, one per kind of Home Assistant user. Each one serves the app under the same
# prefix, removes that prefix, sets X-Ingress-Path and replaces any client copy of X-Remote-User-*.
# Port 8123 also serves a page that frames the app, as the sidebar panel does.
worker_processes 1;
pid /tmp/ingress-sim.pid;
error_log /dev/stderr warn;
user www-data www-data;

events {
    worker_connections 256;
}

http {
    access_log off;
    default_type application/octet-stream;
    client_body_temp_path /tmp/ingress-sim-body;
    proxy_temp_path /tmp/ingress-sim-proxy;
    fastcgi_temp_path /tmp/ingress-sim-fastcgi;
    uwsgi_temp_path /tmp/ingress-sim-uwsgi;
    scgi_temp_path /tmp/ingress-sim-scgi;
    client_max_body_size 0;

    # The Supervisor's responses stream as they arrive, and with ingress_stream its request bodies do too.
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
    # Core adds these to everything it serves.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # A user with a username.
    server {
        listen 8123 default_server;
        # nginx drops inherited proxy_set_header lines once a level has its own, so each server lists them all.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Ingress-Path /api/hassio_ingress/TESTTOKEN;
        proxy_set_header X-Remote-User-Id 0123456789abcdef0123456789abcdef;
        proxy_set_header X-Remote-User-Name hermes-test;
        proxy_set_header X-Remote-User-Display-Name "Hermes Test";
        proxy_set_header X-Remote-User-Groups system-admin;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><meta charset="utf-8"><title>Ingress simulator</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}</style><iframe src="/api/hassio_ingress/TESTTOKEN/"></iframe>';
        }
        location = /api/hassio_ingress/TESTTOKEN {
            return 301 /api/hassio_ingress/TESTTOKEN/;
        }
        location /api/hassio_ingress/TESTTOKEN/ {
            proxy_pass http://172.30.33.10:8099/;
        }
    }

    # A user without a username. The Supervisor sends no X-Remote-User-Name for them.
    # An empty value makes nginx send no header at all, which also drops a client's copy.
    server {
        listen 8124 default_server;
        # nginx drops inherited proxy_set_header lines once a level has its own, so each server lists them all.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Ingress-Path /api/hassio_ingress/TESTTOKEN;
        proxy_set_header X-Remote-User-Id fedcba9876543210fedcba9876543210;
        proxy_set_header X-Remote-User-Name "";
        proxy_set_header X-Remote-User-Display-Name "No Username";
        proxy_set_header X-Remote-User-Groups system-admin;

        location /api/hassio_ingress/TESTTOKEN/ {
            proxy_pass http://172.30.33.10:8099/;
        }
    }

    # No X-Remote-User-* at all. The app must refuse this.
    server {
        listen 8125 default_server;
        # nginx drops inherited proxy_set_header lines once a level has its own, so each server lists them all.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Ingress-Path /api/hassio_ingress/TESTTOKEN;
        proxy_set_header X-Remote-User-Id "";
        proxy_set_header X-Remote-User-Name "";
        proxy_set_header X-Remote-User-Display-Name "";
        proxy_set_header X-Remote-User-Groups "";

        location /api/hassio_ingress/TESTTOKEN/ {
            proxy_pass http://172.30.33.10:8099/;
        }
    }
}
